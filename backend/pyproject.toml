[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stringray-backend"
version = "0.1.0"
description = "Stringray Phase 0 API foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<1",
    "pydantic>=2.13.5,<3",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.1,<3",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
